[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quad-pendulum"
version = "0.1.0"
description = "Realistic real-time simulation and LQR control of a quadruple inverted pendulum on a cart."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mujoco>=3.1,<4",
  "numpy>=1.26",
  "scipy>=1.11",
  "pygame-ce>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
